bundle:
  name: hedis_quality_dashboard

resources:
  jobs:
    bronze_ingestion_job:
      name: "[HEDIS Quality] 01 - Bronze Ingestion"
      tasks:
        - task_key: ingest_to_bronze
          existing_cluster_id: "0304-162117-qgsi1x04"
          notebook_task:
            notebook_path: ./notebooks/01_ingest_to_bronze.py
            source: WORKSPACE
      max_concurrent_runs: 1

    silver_transformation_job:
      name: "[HEDIS Quality] 02 - Silver Transformation"
      tasks:
        - task_key: bronze_to_silver
          existing_cluster_id: "0304-162117-qgsi1x04"
