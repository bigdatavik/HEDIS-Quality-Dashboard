            source: WORKSPACE
      max_concurrent_runs: 1

    sdoh_integration_job:
      name: "[HEDIS Quality] 06 - SDOH Integration"
      tasks:
        - task_key: integrate_sdoh_data
          existing_cluster_id: "0304-162117-qgsi1x04"
          notebook_task:
