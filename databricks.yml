            source: WORKSPACE
      max_concurrent_runs: 1

    roi_uc_functions_job:
      name: "[HEDIS Quality] 09 - ROI UC Functions"
      tasks:
        - task_key: create_roi_functions
          existing_cluster_id: "0304-162117-qgsi1x04"
          notebook_task:
            notebook_path: ./notebooks/09_create_roi_uc_functions.py
            source: WORKSPACE
      max_concurrent_runs: 1

  apps:
    hedis_quality_dashboard_app:
      name: 'hedis-dashboard-vik'
      description: 'HEDIS Quality Measures Dashboard - NCQA compliance tracking for quality team'
      source_code_path: ./dashboard

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

